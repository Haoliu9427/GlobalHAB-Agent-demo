name: release-smoke-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile all Python files
        run: python -m compileall -q app.py run_demo.py scripts src tests
      - name: Verify required release files
        run: python scripts/verify_release.py
      - name: Run release smoke tests
        run: >-
          python -m pytest -q
          tests/test_release_smoke_fast.py
          tests/test_bayesian_design.py
          tests/test_florida_sts.py
          tests/test_broad_benchmark.py
