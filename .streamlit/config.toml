[theme]
primaryColor = "#1D79C5"
backgroundColor = "#F8FBFE"
secondaryBackgroundColor = "#EEF6FC"
textColor = "#123B5A"
font = "sans-serif"

[server]
headless = true
maxUploadSize = 50
# Production deployments are activated with a process restart. Do not evict
# shared Python modules while another Streamlit session is importing them.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
